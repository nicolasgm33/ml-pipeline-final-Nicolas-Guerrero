name: ML Pipeline CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: make install

      - name: Clean previous outputs
        run: |
          rm -rf mlruns models reports
          mkdir -p mlruns models reports

      - name: Lint code
        run: make lint

      - name: Run basic tests
        run: make test

      - name: Train and register model with MLflow
        run: make train

      - name: Upload trained model and MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-pipeline-artifacts
          path: |
            mlruns/
            models/
            reports/
            config.yaml